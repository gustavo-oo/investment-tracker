services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      DB_PATH: /app/data/investments.db
      CSV_DIR: /app/data/csv
      PORT: "3000"
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../../data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
